<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý chi tiêu</title>
<meta name="description" content="Quản lý chi tiêu & lập kế hoạch ngân sách hàng tháng cho gia đình/cá nhân.">
<meta name="theme-color" content="#2563eb">
<meta name="robots" content="noindex, nofollow">
<!-- Cho phép "Thêm vào màn hình chính" trên điện thoại chạy như 1 app riêng
     (ẩn thanh địa chỉ trình duyệt) — Android/Chrome đọc icon+tên từ
     manifest.json, còn iOS/Safari cần thêm các thẻ apple-* riêng dưới đây. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quản lý chi tiêu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='46' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3E%C4%91%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icons/app-icon-192.png">
<!-- iOS/Safari không đọc icon từ manifest.json — bắt buộc phải có link riêng này (PNG, không
     dùng được SVG) thì icon mới hiện đúng khi "Thêm vào màn hình chính". -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<!-- Mở kết nối sớm tới 2 nơi app luôn phải gọi (CDN esm.sh + Supabase) ngay
     lúc parse HTML, đỡ mất thời gian bắt tay DNS/TLS lúc mới mở app. -->
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://iswfooouxpzcijynvalv.supabase.co" crossorigin>
<!-- Kết nối Supabase — CDN ESM, giữ đúng kiến trúc "0 dependency, không cần
     build" của app: xem docs/expense-app-setup.md -->
<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
</script>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#667069;font-family:sans-serif">Đang tải ứng dụng...</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
